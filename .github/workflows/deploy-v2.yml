name: Deploy Boccantina V2 demo

on:
  push:
    branches:
      - version/2-simple
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V2 branch
        uses: actions/checkout@v4
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify V2 and public demo
        run: |
          npm run check:v2
          npm run check:pages:v2
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload V2 static demo
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-v2
      - name: Deploy V2 demo
        id: deployment
        uses: actions/deploy-pages@v4
