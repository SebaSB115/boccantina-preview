<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Acceso administrativo · Boccantina</title>
  <link rel="stylesheet" href="/boccantina-preview/preview/admin-entry.css">
  <meta name="boccantina-demo-base" content="/boccantina-preview">
  <script src="/boccantina-preview/v2/seed.js" defer></script>
  <script src="/boccantina-preview/v2/demo-api.js" defer></script>
  <script src="/boccantina-preview/v2/login.js" defer></script>
</head>
<body class="admin-entry entry-page">
  <a class="entry-skip" href="#acceso">Ir al formulario</a>
  <main class="entry-login" id="acceso" tabindex="-1">
    <a class="entry-back back-link" href="/boccantina-preview/carta/">← Ver carta</a>
    <div class="entry-login__body">
      <div class="entry-brand"><span class="entry-brand__logo entry-brand__logo--boccantina"><img src="/boccantina-preview/preview/assets/boccantina-logo-transparent.png" alt="Boccantina, cantina de vinos" width="401" height="98"></span></div>
      <h1 class="entry-kicker">ACCESO DE DEMOSTRACIÓN</h1>
      <form class="entry-form" id="login-form" method="post">
        <div class="entry-field"><label for="username">Usuario</label><input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="80" required></div>
        <div class="entry-field"><label for="password">Contraseña</label><div class="entry-password"><input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required><button id="show-password" type="button" aria-controls="password" aria-pressed="false">Mostrar</button></div></div>
        <p id="login-error" class="entry-error" role="alert" aria-live="polite"></p>
        <button class="entry-button" type="submit" disabled>Entrar a la administración <span aria-hidden="true">→</span></button>
      </form>
      <p class="entry-foot">DEMO PÚBLICA · Usuario: demo-boccantina · Clave: vista2026 · No uses contraseñas reales.</p>
    </div>
  </main>
</body>
</html>
